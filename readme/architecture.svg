<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#101218"/>
  <style>
    .title{font:700 34px Arial;fill:#f4f5f7}.h{font:700 24px Arial;fill:#fff}.t{font:18px Arial;fill:#d7dae0}.box{stroke-width:2;rx:18}.arrow{stroke:#d9485f;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9485f"/></marker></defs>
  <text x="60" y="65" class="title">ALOFOQ — Current Layered Procedural Architecture</text>
  <rect x="70" y="125" width="300" height="360" class="box" fill="#1f2633" stroke="#4d78cc"/>
  <text x="105" y="175" class="h">Presentation</text>
  <text x="105" y="220" class="t">• PHP screens</text><text x="105" y="255" class="t">• Action scripts</text><text x="105" y="290" class="t">• HTML and forms</text><text x="105" y="325" class="t">• Bootstrap and CSS</text><text x="105" y="360" class="t">• Session-based state</text>
  <rect x="450" y="125" width="300" height="360" class="box" fill="#25232d" stroke="#ab67c7"/>
  <text x="485" y="175" class="h">Business</text>
  <text x="485" y="220" class="t">• Procedural functions</text><text x="485" y="255" class="t">• Validation</text><text x="485" y="290" class="t">• Inventory rules</text><text x="485" y="325" class="t">• Password hashing</text><text x="485" y="360" class="t">• Workflow decisions</text>
  <rect x="830" y="125" width="300" height="360" class="box" fill="#202b29" stroke="#53a982"/>
  <text x="865" y="175" class="h">Data Access</text>
  <text x="865" y="220" class="t">• PDO functions</text><text x="865" y="255" class="t">• Prepared statements</text><text x="865" y="290" class="t">• MySQL queries</text><text x="865" y="325" class="t">• Connection settings</text><text x="865" y="360" class="t">• Simple schema</text>
  <path d="M370 305 L445 305" class="arrow"/><path d="M750 305 L825 305" class="arrow"/>
  <text x="70" y="550" class="t">The folders are separated by responsibility, while the implementation remains functional/procedural rather than object-oriented.</text>
</svg>
